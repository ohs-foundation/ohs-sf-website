# Organisations on the Members page (/members), grouped into the bands below.
# Tiers marked showOnHome: true also appear in the logo strip on the home page.
#
# TIERS — display order follows this list; members point at a tier by its `id`.
#   The Members page puts the tiers into three separate bands:
#   Foundation members (premier_strategic, general_associate), Supporting
#   organisations (supporters) and Advisory support (advisory_support).
#
# MEMBERS — within a tier, organisations appear in the order listed here.
#   name:     organisation name (the logo's alt text, read out by screen readers)
#   tier:     a tier id from the list above
#   url:      their website (optional)
#   logo:     a file in assets/members/ (optional — SVG preferred; PNG/JPG/WebP
#             are resized automatically). Without a logo, the name's initials show.
#   logoDark: the version for dark backgrounds, used in dark mode — a file in
#             assets/members/dark/ (optional; without it the normal logo is used).
#             Marked "official" below when the organisation supplied it; the
#             others were made from the normal logo by turning its dark colours
#             white, until an official one arrives.
#   pending:  true while the organisation's sign-off is still outstanding. Pending
#             organisations show on Netlify previews and on `hugo server`, but
#             never on the live site. Remove the line once they've approved.
#   logoScale: optional size tweak, e.g. 1.2 or 0.85. Logos are balanced
#             automatically by their shape; use this only if one still looks
#             too big or too small next to the others.
#   logoWidth: optional exact width in pixels, for a logo whose brand rules set a
#             minimum on-screen width (it overrides the automatic size).
#
# Never list Ona: Recode Labs replaces it.

tiers:
  - id: premier_strategic
    name: Premier members & strategic partners
    showOnHome: true
  - id: general_associate
    name: General & associate members
  - id: supporters
    name: Supporting organisations
  - id: advisory_support
    name: With advisory support from

