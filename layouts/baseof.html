<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">

<head>
  {{- partial "head.html" . }}
</head>

<body>
  <a class="skip-link" href="#main">{{ T "skipToContent" }}</a>
  {{- partial "header.html" . }}

  <main id="main">
  {{ block "main" . }}{{ end }}

  {{- if not (.Params.hideNewsletter) }}
  {{ partial "newsletter-band.html" . }}
  {{- end }}
  </main>

  {{ partial "footer.html" . }}
</body>

</html>
