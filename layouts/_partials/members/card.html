{{- /* One member: its logo (or initials), linking to their site.
       Arg: member map (add "featured": true for the larger premier cards). */ -}}
{{- $inner := partial "members/card-inner.html" . -}}
{{- with .url }}
<a class="member-card" href="{{ . }}" target="_blank" rel="noopener">{{ $inner }}</a>
{{- else }}
<div class="member-card">{{ $inner }}</div>
{{- end }}
