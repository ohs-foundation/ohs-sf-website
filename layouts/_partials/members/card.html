{{- /* One member: logo (or initials) + name, linking to their site. Arg: member map. */ -}}
{{- $inner := partial "members/card-inner.html" . -}}
{{- with .url }}
<a class="member-card" href="{{ . }}" target="_blank" rel="noopener">{{ $inner }}</a>
{{- else }}
<div class="member-card">{{ $inner }}</div>
{{- end }}
