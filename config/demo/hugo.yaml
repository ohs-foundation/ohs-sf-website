# `hugo server --environment demo` — preview the site with sample content:
#   - sample members (data/members_demo.yaml, assets/members/demo/)
#   - sample blog posts (demo/content/blog/ — marked draft, never published)
# The production build ignores all of this.

buildDrafts: true

params:
  membersData: members_demo

module:
  mounts:
    - { source: content, target: content }
    - { source: demo/content, target: content }
