[build]
  publish = "."

# ── Preview lock (disabled) ───────────────────────────────────────────────
# The site is public. To re-enable the PIN gate, uncomment the block below
# (the edge function at netlify/edge-functions/auth.js and lock.html remain
# in the repo, dormant, for exactly this purpose).
#
# [[edge_functions]]
#   path = "/*"
#   function = "auth"

# ── Short links ───────────────────────────────────────────────────────────
# Working-group sign-up (EmailOctopus form tagged "working-groups").
# 302 so the target can move without browsers caching the old one.
[[redirects]]
  from = "/get-involved"
  to = "/community.html#working-groups"
  status = 302
